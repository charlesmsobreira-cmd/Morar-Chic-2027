<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" width="130" height="42" fill="none" stroke="#2c2825" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Haste principal sinuosa orgânica -->
  <path d="M 12 36 C 35 24, 60 38, 90 22 C 115 12, 138 26, 148 18" stroke-width="1.3"/>
  <path d="M 38 29 C 48 20, 56 16, 68 18" stroke-width="1"/>
  <path d="M 85 24 C 95 32, 108 36, 118 32" stroke-width="1"/>

  <!-- Folha 1 (esquerda inferior) -->
