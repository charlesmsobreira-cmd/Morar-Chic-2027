    <circle cx="0" cy="0" r="2.6" fill="#2c2825"/>
    <path d="M 0 -2.6 C -3.5 -8.5, 3.5 -8.5, 0 -2.6 Z" fill="#ffffff" stroke="#2c2825" stroke-width="1.1"/>
