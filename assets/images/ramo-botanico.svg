  <line x1="20" y1="37" x2="26" y2="41" stroke-width="0.8"/>

  <!-- Folha 2 (esquerda superior) -->
  <path d="M 32 26 C 28 18, 35 14, 40 18 C 42 22, 38 25, 32 26 Z" fill="#2c2825" fill-opacity="0.12"/>
  <line x1="34" y1="23" x2="38" y2="19" stroke-width="0.8"/>

