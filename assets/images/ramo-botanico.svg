    <path d="M -1.6 2 C -5 7.5, 0.5 9, -1.6 2 Z" fill="#ffffff" stroke="#2c2825" stroke-width="1.1"/>
    <path d="M -2.6 -0.8 C -8 -4, -9 2.5, -2.6 -0.8 Z" fill="#ffffff" stroke="#2c2825" stroke-width="1.1"/>
