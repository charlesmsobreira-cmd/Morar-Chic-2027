    <path d="M -2.2 0 C -7 -3, -7 3, -2.2 0 Z" fill="#ffffff" stroke="#2c2825" stroke-width="1"/>
    <!-- Estames centrais -->
    <circle cx="-0.8" cy="-0.6" r="0.4" fill="#2c2825"/>
    <circle cx="0.8" cy="-0.6" r="0.4" fill="#2c2825"/>
    <circle cx="0" cy="0.9" r="0.4" fill="#2c2825"/>
  </g>

  <!-- Folhas centrais -->
  <path d="M 66 28 C 68 37, 76 38, 80 32 C 78 28, 72 26, 66 28 Z" fill="#2c2825" fill-opacity="0.12"/>
  <path d="M 72 17 C 76 9, 85 10, 86 16 C 82 19, 76 18, 72 17 Z" fill="#2c2825" fill-opacity="0.12"/>

  <!-- Flor 2 (centro-direita proeminente) -->
