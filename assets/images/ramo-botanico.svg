  <path d="M 116 26 C 122 34, 131 32, 132 25 C 127 23, 120 23, 116 26 Z" fill="#2c2825" fill-opacity="0.12"/>
  <path d="M 125 14 C 130 7, 139 9, 139 15 C 134 17, 128 16, 125 14 Z" fill="#2c2825" fill-opacity="0.12"/>

