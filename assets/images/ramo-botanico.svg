    <circle cx="0" cy="0" r="1.8" fill="#2c2825"/>
    <path d="M 0 -1.8 C -2 -5, 2 -5, 0 -1.8 Z" fill="#ffffff" stroke="#2c2825" stroke-width="0.9"/>
